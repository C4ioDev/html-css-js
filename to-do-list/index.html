<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.x.x/font/bootstrap-icons.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>

        <nav>
            <input type="button" value="Adicionar Tarefa">
            <input type="button" value="Editar Tarefa">
            <input type="button" value="Finalizar Tarefa">
        </nav>

        <h1 id="titulo_principal">Lista de tarefas</h1>

    </header>
    <main>
        <input type="text" name="" id="input_tarefa" placeholder="Ex: Estudar programação...">
        <i class="bi bi-plus-square" id="adicionar_tarefa"></i>

        <section>
            <ul id="lista">
                <li>
                    <input type="checkbox" name="" class="finalizado">
                    <p class="tarefa">Dar ração para cachorro</p>
                    <i class="bi bi-pencil-square editar_tarefa"></i>
                    <i class="bi bi-trash remover_tarefa"></i>
                </li>
                       
                 <li>
                    <input type="checkbox" name="" class="finalizado">
                    <p class="tarefa">Estudar inglês</p>
                    <i class="bi bi-pencil-square editar_tarefa"></i>
                    <i class="bi bi-trash remover_tarefa"></i>
                </li>   
            </ul>
        </section>
    </main>
    <footer>
        <p>Desenvolvido na CTRL PLAY por <a href="https://github.com/gustavoferreir4" target="_blank">C4ioDev</a></p>
        <p>2025</p>
    </footer>
    <script src="./script.js"></script>
</body>
</html>
